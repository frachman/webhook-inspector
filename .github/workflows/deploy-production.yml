name: Deploy production

on:
  workflow_run:
    workflows: [Publish images]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webhook-inspector-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified images to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_KEY_PASSPHRASE: ${{ secrets.PROD_SSH_KEY_PASSPHRASE }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          cat > "$RUNNER_TEMP/ssh/askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$PROD_SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/ssh/askpass"
          eval "$(ssh-agent -s)"
          export SSH_ASKPASS="$RUNNER_TEMP/ssh/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          ssh-add "$RUNNER_TEMP/ssh/deploy_key" < /dev/null
          export IMAGE_TAG="sha-$RELEASE_SHA"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$RUNNER_TEMP/ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$PROD_SSH_USER@$PROD_SSH_HOST" sudo /usr/local/sbin/mikrolyt-hookbin-deploy "$IMAGE_TAG"
