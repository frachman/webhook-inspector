name: Publish images

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Verified commit SHA to publish
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish immutable container images
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.image_ref != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/webhook-inspector-api:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_ref }}
      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/webhook-inspector-web:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_ref }}
