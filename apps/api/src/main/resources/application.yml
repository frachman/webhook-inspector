spring:
  application:
    name: webhook-inspector-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webhook_dev}
    username: ${DB_USERNAME:webhook_dev}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

webhook:
  default-ttl-hours: ${WEBHOOK_DEFAULT_TTL_HOURS:24}
  max-body-bytes: ${WEBHOOK_MAX_BODY_BYTES:262144}
