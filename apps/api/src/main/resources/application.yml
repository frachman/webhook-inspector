spring:
  application:
    name: webhook-inspector-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webhook_dev}
    username: ${DB_USERNAME:webhook_dev}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

webhook:
  default-ttl-hours: ${WEBHOOK_DEFAULT_TTL_HOURS:24}
  max-body-bytes: ${WEBHOOK_MAX_BODY_BYTES:262144}
  max-requests-per-endpoint: ${WEBHOOK_MAX_REQUESTS_PER_ENDPOINT:100}
  cleanup-interval: ${WEBHOOK_CLEANUP_INTERVAL:PT1H}
  public-base-url: ${WEBHOOK_PUBLIC_BASE_URL:}

rate-limit:
  api-per-minute: ${WEBHOOK_API_RATE_LIMIT_PER_MINUTE:60}
  webhook-per-minute: ${WEBHOOK_CAPTURE_RATE_LIMIT_PER_MINUTE:120}
  max-tracked-keys: ${WEBHOOK_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
